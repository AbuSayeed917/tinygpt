[project]
name = "tinygpt"
version = "0.1.0"
description = "A small decoder-only language model, built and trained from scratch, served on masayeed.co.uk"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["lesson01"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
